// This is a simple example script to show what a google automation looks like, all code is hosted on the homeassistant server

metadata:
  name: Office on
  description: Turn on the office light
automations:
  - starters:
      - type: device.state.OnOff
        device: Office Light - Office
        state: on
        is: false
    actions:
      - type: device.command.OnOff
        devices:
          - Office Light - Office
        on: true
