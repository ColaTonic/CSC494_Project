esphome:
  name: buttontest
  friendly_name: ButtonTest


esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf


# Enable logging
logger:


# Enable Home Assistant API
api:
  encryption:
    key: "v5xBHpmdt3FkzplPAwc+VVgbZaHYq697tJf6/RXxnnI="


ota:
  - platform: esphome
    password: "d415f849f9cfad9221309bdbf78f5f30"


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Buttontest Fallback Hotspot"
    password: "dyd2iw743Z6q"


captive_portal:
   
text_sensor:
  - platform: template
    name: Scene Button
    id: scene_button
    lambda: |-
      return {"Released"};
       
binary_sensor:
  - platform: gpio
    pin:
     number: 19
     mode: INPUT_PULLUP
     inverted: true
    name: "Scene Button 1"
    internal: true
   
    filters:
     delayed_on_off: 50 ms


    on_multi_click:
   
    - timing:
        - ON for at least 1s
        - OFF for at least 1s
      then:
      - text_sensor.template.publish:
            id: scene_button
            state: "Hold"
      - delay: 2 s
      - text_sensor.template.publish:
            id: scene_button
            state: "Released"
       
    - timing:
        - ON for at most 0.5s
        - OFF for at least 1s
      then:
        - text_sensor.template.publish:
            id: scene_button
            state: "Clicked"
        - delay: 2 s
        - text_sensor.template.publish:
            id: scene_button
            state: "Released"
    - timing:
        - ON for at most 0.5s
        - OFF for at most 0.5s
        - ON for at most 0.5s
        - OFF for at least 1s
      then:
      - text_sensor.template.publish:
            id: scene_button
            state: "Double Clicked"
      - delay: 2 s
      - text_sensor.template.publish:
            id: scene_button
            state: "Released"    
    - timing:
        - ON for at most 0.5s
        - OFF for at most 0.5s
        - ON for at most 0.5s
        - OFF for at most 0.5s
        - ON for at most 0.5s
        - OFF for at least 1s
      then:
        - text_sensor.template.publish:
            id: scene_button
            state: "Triple Clicked"
        - delay: 2 s
        - text_sensor.template.publish:
            id: scene_button
            state: "Released"
       
    - timing:
        - ON for at most 0.5s
        - OFF for at most 0.5s
        - ON for at most 0.5s
        - OFF for at most 0.5s
        - ON for at most 0.5s
        - OFF for at most 0.5s
        - ON for at most 0.5s
        - OFF for at least 1s
      then:
        - text_sensor.template.publish:
            id: scene_button
            state: "Quad Clicked"
        - delay: 2 s
        - text_sensor.template.publish:
            id: scene_button
            state: "Released"



